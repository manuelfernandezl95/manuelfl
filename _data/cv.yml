- title: Experience
  type: time_table
  contents:
  - title: Postdoctoral Researcher, Lattice Field Theory Group
    institution: National Yang Ming Chiao Tung University (NYCU)
    year: Sept 2026 - Present
    description:
    - Member of the Lattice Field Theory Group at NYCU, translating computational techniques between condensed matter physics and non-perturbative QCD.
    - Applying parton-based and exact diagonalization methods developed for strongly correlated, topologically ordered systems to open questions in hadron structure.
    - Building complementary expertise in tensor network and DMRG approaches to lattice gauge theories.
  - title: Associate Researcher
    institution: Autonomous University of Madrid (UAM)
    year: Nov 2024 - Sept 2026
    description:
    - Developed theoretical approaches to compute Green's function zeros in topological Mott insulators; application to the Kitaev-Hubbard model (preprint in final stage).
    - Co-supervised a PhD project on unconventional superconductivity in nickelate heterostructures using semi-analytical and numerical many-body techniques.
    - Proposed novel topological strongly correlated systems to apply AI-driven methodologies developed within the group.
    - Prepared a referee report for Physical Review Letters; regularly handled editorial/referee correspondence as corresponding/co-author.
    - Acted as corresponding author on the first publication of a PhD student, structuring the manuscript and overseeing the full reviewer-editor correspondence.
  - title: Researcher Formation Fellow (FPI)
    institution: Autonomous University of Madrid (UAM)
    year: Sep 2019 - Oct 2024
    description:
    - Implemented a finite-T slave-rotor mean-field framework for topological Mott transitions; benchmarked local limits against DMFT.
    - Identified flat-band topological superconductivity and localized Majorana edge modes in metal-organic frameworks (Phys. Rev. B 106, 235129, 2022).
    - Performed slab Green's-function calculations revealing spinon Fermi arcs, a novel type of topological surface state (Phys. Rev. B 109, 085137, 2024).
    - Derived effective Hubbard models from first-principles DFT band structures for strongly correlated-material modeling (Phys. Rev. B 111, 165133, 2025).
  - title: Scientific Technician, National Research Project
    institution: Autonomous University of Madrid (UAM)
    year: Mar 2018 - Aug 2019
    description:
    - Adapted master's thesis results into a peer-reviewed publication and managed correspondence with editors and referees (Phys. Rev. B 100, 075154, 2019).
    - Prepared departmental talks and presented results at a national conference.
- title: Research Projects
  type: time_table
  contents:
  - title: Tensor networks and quantum computing for high-energy physics
    institution: 'NSTC special-project grant; PI: Prof. C.-J. David Lin, Lattice Field Theory Group, NYCU'
    year: 2026 - Present
    description: []
  - title: New concepts and methods for topological strongly correlated quantum matter
    institution: 'Ref. PID2022-139995NB-I00; IP: Jorge Bravo Abad'
    year: 2023 - 2026
    description:
    - Computed non-local Green's function in-gap zeros delineating nodal-line, charge-neutral low-energy excitations — a fractionalized protected state (spinon drumhead states).
    - Led an individual research line computing Green's function zeros in Kitaev materials such as alpha-RuCl3, opening a route to identify topological phases via GF zeros in correlated superconductors.
  - title: New phenomena and applications of topological strongly correlated materials in and out of equilibrium
    institution: 'Ref. RTI2018-098452-B-I00; IP: Jaime Merino Troncoso (FPI PRE2019-087603)'
    year: 2019 - 2023
    description:
    - Supervised a master's student on code adaptation for correlated nodal-line semimetals relevant to (ET)Ag4(CN)5 compounds, providing the first theoretical realization of the observed pressure-induced Mott transition.
    - Developed a semi-analytical strongly correlated technique extended to finite temperature, revealing that non-local correlations beyond DMFT lead to spinon Fermi arcs, with predicted ARPES signatures on pyrochlore iridates.
    - Investigated correlated topology in flat-band decorated honeycomb lattices motivated by metal-organic frameworks (MOFs); exact diagonalization revealed a flat-band quantum spin liquid consistent with experiments.
    - Explored flat-band unconventional superconductivity from doping this spin liquid, characterizing localized Majorana edge modes and their potential for topological quantum computing.
  - title: New electronic and photonic materials based on topological strongly correlated systems
    institution: 'Ref. MAT2015-66128-R; IP: Jaime Merino Troncoso'
    year: 2017 - 2018
    description:
    - Implemented Hartree-Fock calculations in a decorated honeycomb lattice relevant to certain MOFs, identifying topological semimetals.
    - Presented findings at national conferences and acted as corresponding author in the peer-review process.
