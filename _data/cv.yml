      - bullet: "*Magnetism and Topological Phases in an Interacting Decorated Honeycomb Lattice with Spin-Orbit Coupling* — Oral contribution, INC Young Researchers Meeting, Madrid (2021)"
      - bullet: "*Topological Phases Induced by Interactions and Spin-Orbit Coupling in Decorated Honeycomb Lattices* — Oral contribution, APS March Meeting, online (2021)"
      - bullet: "*Bad Topological Semimetals in Layered Honeycomb Compounds* — Oral contribution, APS March Meeting, Chicago, IL, USA (2022)"
      - bullet: "*Bad Topological Semimetals in Layered Honeycomb Compounds* — Invited talk, School of Mathematics and Physics, University of Queensland, Australia (2022)"
      - bullet: "*Emergence of Spinon Fermi Arcs in the Weyl-Mott Metal-Insulator Transition* — Oral contribution, INC Young Researchers Meeting, Madrid (2024)"
      - bullet: "*Bad Weyl Semimetals and Spinon Fermi Arcs in a Model for Pyrochlore Iridates* — Oral contribution, IOP CMQM 2024, St. Andrews, Scotland (2024)"
