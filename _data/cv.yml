      - label: "Programming & Software"
        details: "LaTeX, Fortran, Matlab (high proficiency); Adobe Suite, Wolfram Mathematica (advanced); Python (beginner); Windows, macOS, Linux"
      - label: "Communication"
        details: "Manuscript evaluation, referee correspondence, figure/table preparation"
      - label: "Languages"
