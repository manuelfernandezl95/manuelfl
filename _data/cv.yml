    Experience:
      - company: Institute of Physics, National Yang Ming Chiao Tung University
        position: Postdoctoral Researcher, Lattice Field Theory Group
        start_date: 2026-09
        end_date: present
        location: Hsinchu, Taiwan
        highlights:
          - Member of the Lattice Field Theory Group at NYCU, translating computational techniques between condensed matter physics and non-perturbative QCD.
          - Applying parton-based and exact diagonalization methods developed for strongly correlated, topologically ordered systems to open questions in hadron structure.
          - Building complementary expertise in tensor network and DMRG approaches to lattice gauge theories.
          - "Research project: Tensor networks and quantum computing for high-energy physics (NSTC grant 112-2112-M-A49-021-MY3; PI: Prof. C.-J. David Lin) — contributing to a project applying tensor-network and quantum-computing methods, developed for strongly correlated condensed matter systems, to problems in high-energy physics."
      - company: Autonomous University of Madrid (UAM)
        position: Associate Researcher
        start_date: 2024-11
        end_date: 2026-08
        location: Madrid, Spain
        highlights:
          - Developed theoretical approaches to compute Green's function zeros in topological Mott insulators; application to the Kitaev-Hubbard model (preprint in final stage).
          - Proposed novel topological strongly correlated systems to apply AI-driven methodologies developed within the group.
          - Prepared a referee report for Physical Review Letters; regularly handled editorial/referee correspondence as corresponding/co-author.
          - "Research project: New concepts and methods for topological strongly correlated quantum matter (Ref. PID2022-139995NB-I00; IP: Jorge Bravo Abad) — computed non-local Green's function in-gap zeros delineating a fractionalized protected state (spinon drumhead states), and led a research line computing Green's function zeros in Kitaev materials such as alpha-RuCl3, opening a route to identify topological phases in correlated superconductors."
          - "Supervised a Master's student (March 2024 – March 2025) on nodal-line Mott insulator physics; acted as corresponding author on the resulting publication (J. C. Luaces, M. F. López, J. Bravo Abad & J. Merino, \"Topological strongly correlated phases in orthorhombic diamond lattice compounds,\" Phys. Rev. B 111, 165133, 2025), guiding the full submission and peer-review process."
          - "Co-supervising a Ph.D. student (ongoing, through weekly group meetings) on inhomogeneous superconductivity in layered cuprates and nickelates, using extended Gutzwiller approximations complemented with AI-trained variational and numerical methods such as Monte Carlo; a collaborative manuscript is currently in its final stage."
      - company: Autonomous University of Madrid (UAM)
        position: Researcher Formation Fellow (FPI)
        start_date: 2019-09
        end_date: 2024-10
        location: Madrid, Spain
        highlights:
          - Implemented a finite-T slave-rotor mean-field framework for topological Mott transitions; benchmarked local limits against DMFT.
          - Identified flat-band topological superconductivity and localized Majorana edge modes in metal-organic frameworks (Phys. Rev. B 106, 235129, 2022).
          - Performed slab Green's-function calculations revealing spinon Fermi arcs, a novel type of topological surface state (Phys. Rev. B 109, 085137, 2024).
          - Derived effective Hubbard models from first-principles DFT band structures for strongly correlated-material modeling (Phys. Rev. B 111, 165133, 2025).
          - "Research project: New phenomena and applications of topological strongly correlated materials in and out of equilibrium (Ref. RTI2018-098452-B-I00; IP: Jaime Merino Troncoso, FPI PRE2019-087603) — supervised a master's student on code adaptation for correlated nodal-line semimetals, providing the first theoretical realization of the observed pressure-induced Mott transition; developed a semi-analytical technique extended to finite temperature revealing that non-local correlations lead to spinon Fermi arcs, with predicted ARPES signatures on pyrochlore iridates; investigated correlated topology in flat-band decorated honeycomb lattices motivated by MOFs, with exact diagonalization revealing a flat-band quantum spin liquid consistent with experiments; and explored flat-band unconventional superconductivity from doping this spin liquid, characterizing localized Majorana edge modes and their potential for topological quantum computing."
          - "Lecturer & Lab Supervisor, Physics Laboratory course for Environmental Science undergraduates, 2nd year (2021–2022)."
      - company: Autonomous University of Madrid (UAM)
        position: Scientific Technician, National Research Project
        start_date: 2018-03
        end_date: 2019-08
        location: Madrid, Spain
        highlights:
          - Adapted master's thesis results into a peer-reviewed publication and managed correspondence with editors and referees (Phys. Rev. B 100, 075154, 2019).
          - Prepared departmental talks and presented results at a national conference.
          - "Research project: New electronic and photonic materials based on topological strongly correlated systems (Ref. MAT2015-66128-R; IP: Jaime Merino Troncoso) — implemented Hartree-Fock calculations in a decorated honeycomb lattice relevant to certain MOFs, identifying topological semimetals; presented findings at national conferences and acted as corresponding author in the peer-review process."
    Publications:
