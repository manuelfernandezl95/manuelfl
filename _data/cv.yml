        end_date: 2024
        location: Madrid, Spain
        highlights:
          - 'Thesis: ["Fractionalized topological phases in strongly correlated materials with spin-orbit coupling"](https://repositorio.uam.es/handle/10486/717886)'
          - "Supervisor: Prof. Jaime Merino"
          - "Defense: Oct 2024 — Cum laude"
      - institution: Autonomous University of Madrid (UAM)
        area: Condensed Matter Physics and Biological Systems
        degree: MSc
        start_date: 2017
        end_date: 2018
        location: Madrid, Spain
        highlights:
          - 'Thesis: "Spin-orbit coupling and Coulomb interaction effects in decorated honeycomb lattices"'
      - institution: Autonomous University of Madrid (UAM)
        area: Physics
        degree: BSc
        start_date: 2013
        end_date: 2017
        location: Madrid, Spain
        highlights:
          - 'Theoretical final project: "Bosonic string theory for the derivation of the graviton and compactification of 25+1 dimensions."'
          - 'Experimental final project: "Data analysis for the determination of the Z_0 boson mass using LHC data."'
          - "High honors in Thermodynamic and Statistical Physics I and II, Quantum Mechanics II, Physical Electronics, Magnetism and Superconductivity"
    Experience:
      - company: Institute of Physics, National Yang Ming Chiao Tung University
        position: Postdoctoral Researcher, Lattice Field Theory Group
        start_date: 2026-09
        end_date: present
        location: Hsinchu, Taiwan
        highlights:
          - Member of the Lattice Field Theory Group at NYCU, translating computational techniques between condensed matter physics and non-perturbative QCD.
          - Applying parton-based and exact diagonalization methods developed for strongly correlated, topologically ordered systems to open questions in hadron structure.
          - Building complementary expertise in tensor network and DMRG approaches to lattice gauge theories.
      - company: Autonomous University of Madrid (UAM)
        position: Associate Researcher
        start_date: 2024-11
        end_date: 2026-09
        location: Madrid, Spain
        highlights:
          - Developed theoretical approaches to compute Green's function zeros in topological Mott insulators; application to the Kitaev-Hubbard model (preprint in final stage).
          - Co-supervised a PhD project on unconventional superconductivity in nickelate heterostructures using semi-analytical and numerical many-body techniques.
          - Proposed novel topological strongly correlated systems to apply AI-driven methodologies developed within the group.
          - Prepared a referee report for Physical Review Letters; regularly handled editorial/referee correspondence as corresponding/co-author.
          - Acted as corresponding author on the first publication of a PhD student, structuring the manuscript and overseeing the full reviewer-editor correspondence.
      - company: Autonomous University of Madrid (UAM)
        position: Researcher Formation Fellow (FPI)
        start_date: 2019-09
        end_date: 2024-10
        location: Madrid, Spain
        highlights:
          - Implemented a finite-T slave-rotor mean-field framework for topological Mott transitions; benchmarked local limits against DMFT.
          - Identified flat-band topological superconductivity and localized Majorana edge modes in metal-organic frameworks (Phys. Rev. B 106, 235129, 2022).
          - Performed slab Green's-function calculations revealing spinon Fermi arcs, a novel type of topological surface state (Phys. Rev. B 109, 085137, 2024).
          - Derived effective Hubbard models from first-principles DFT band structures for strongly correlated-material modeling (Phys. Rev. B 111, 165133, 2025).
      - company: Autonomous University of Madrid (UAM)
        position: Scientific Technician, National Research Project
        start_date: 2018-03
        end_date: 2019-08
        location: Madrid, Spain
        highlights:
          - Adapted master's thesis results into a peer-reviewed publication and managed correspondence with editors and referees (Phys. Rev. B 100, 075154, 2019).
          - Prepared departmental talks and presented results at a national conference.
      - company: Institute of Physics, NYCU. Ref. NSTC project grant 112-2112-M-A49-021-MY3
        position: "Research Project — Tensor networks and quantum computing for high-energy physics"
        start_date: 2026
        end_date: present
        location: "PI: Prof. C.-J. David Lin, Lattice Field Theory Group, NYCU"
        highlights:
          - Contributing to a project applying tensor-network and quantum-computing methods, developed for strongly correlated condensed matter systems, to problems in high-energy physics.
      - company: Department of theoretical condensed matter physics, UAM. Ref. PID2022-139995NB-I00
        position: "Research Project — New concepts and methods for topological strongly correlated quantum matter"
        start_date: 2023
        end_date: 2026
        location: "IP: Jorge Bravo Abad"
        highlights:
          - Computed non-local Green's function in-gap zeros delineating a fractionalized protected state (spinon drumhead states).
          - Led a research line computing Green's function zeros in Kitaev materials such as alpha-RuCl3, opening a route to identify topological phases in correlated superconductors.
      - company: Department of theoretical condensed matter physics, UAM. Ref. RTI2018-098452-B-I00
        position: "Research Project — New phenomena and applications of topological strongly correlated materials in and out of equilibrium"
        start_date: 2019
        end_date: 2021
        location: "IP: Jaime Merino Troncoso (FPI PRE2019-087603)"
        highlights:
          - Supervised a master's student on code adaptation for correlated nodal-line semimetals, providing the first theoretical realization of the observed pressure-induced Mott transition.
          - Developed a semi-analytical technique extended to finite temperature revealing that non-local correlations lead to spinon Fermi arcs, with predicted ARPES signatures on pyrochlore iridates.
          - Investigated correlated topology in flat-band decorated honeycomb lattices motivated by MOFs; exact diagonalization revealed a flat-band quantum spin liquid consistent with experiments.
          - Explored flat-band unconventional superconductivity from doping this spin liquid, characterizing localized Majorana edge modes and their potential for topological quantum computing.
      - company: Department of theoretical condensed matter physics, UAM. Ref. MAT2015-66128-R
        position: "Research Project — New electronic and photonic materials based on topological strongly correlated systems"
        start_date: 2016
        end_date: 2019
        location: "IP: Jaime Merino Troncoso"
        highlights:
          - Implemented Hartree-Fock calculations in a decorated honeycomb lattice relevant to certain MOFs, identifying topological semimetals.
          - Presented findings at national conferences and acted as corresponding author in the peer-review process.
      - company: Autonomous University of Madrid (UAM)
        position: "Teaching — Co-supervisor of a Master's and current Ph.D. student"
        start_date: 2024
        end_date: present
        location: Madrid, Spain
        highlights:
          - Mentoring on topological strongly correlated electron models and Green's function zeros analysis, resulting in a joint publication.
          - As corresponding author on the student's first paper, guided the full publication pipeline (submission, revision, peer-review dialogue) while enforcing good practices in code/documentation and reproducible workflows.
      - company: Autonomous University of Madrid (UAM)
        position: "Teaching — Lecturer & Lab Supervisor, Physics Laboratory course"
        start_date: 2021
        end_date: 2022
        location: Madrid, Spain
        highlights:
          - Physics Laboratory course for Environmental Science undergraduates (2nd year).
    Peer-Review Activity:
      - bullet: Referee report prepared for Physical Review Letters (submitted Aug 2025; editorial decision Sep 2025), assessing significance, methodological soundness and clarity of presentation.
      - bullet: Regularly manage reviewer/editor correspondence for co-authored and first-authored manuscripts, including coordinating responses, revising manuscripts, and ensuring reporting/figures meet journal standards.
      - bullet: Peer reviewer for Physical Review B, first as co-referee with supervisor, later as an independent referee.
      - bullet: Experience assessing reproducibility, figure clarity, methodological soundness and experimental relevance in theoretical manuscripts, with a focus on transparent availability of data and custom code.
