    Profile:
      - bullet: Condensed matter theorist specializing in topologically ordered, strongly correlated systems and their applications to quantum information science.
    Research Focus:
      - bullet: Strongly correlated quantum materials
      - bullet: Interaction-driven topological transitions
      - bullet: Flat-band topological superconductivity in frustrated lattices
      - bullet: Green function zeros to clasify toplogical strongly correlated systems
