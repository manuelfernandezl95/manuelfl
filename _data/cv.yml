      - bullet: 'M. F. López, I. García Elcano, J. Bravo Abad & J. Merino, "Emergence of spinon Fermi arcs in the Weyl-Mott metal insulator transition", [Phys. Rev. B 109, 085137 (2024)](https://doi.org/10.1103/PhysRevB.109.085137)'
      - bullet: 'M. F. López & J. Merino, "Bad topological semimetals in layered honeycomb compounds", [Phys. Rev. B 105, 115138 (2022)](https://doi.org/10.1103/PhysRevB.105.115138)'
      - bullet: 'M. F. López, B. J. Powell & J. Merino, "Topological superconductivity from doping a triplet quantum spin liquid in a flat band system", [Phys. Rev. B 106, 235129 (2022)](https://doi.org/10.1103/PhysRevB.106.235129)'
      - bullet: 'J. Merino, M. F. López & B. J. Powell, "Unconventional superconductivity near a flat band in organic and organometallic materials", [Phys. Rev. B 103, 094517 (2021)](https://doi.org/10.1103/PhysRevB.103.094517)'
      - bullet: 'M. F. López & J. Merino, "Magnetism and topological phases in an interacting decorated honeycomb lattice with spin-orbit coupling", [Phys. Rev. B 102, 035157 (2020)](https://doi.org/10.1103/PhysRevB.102.035157)'
      - bullet: 'M. F. López & J. Merino, "From quantum anomalous Hall phases to topological metals in interacting decorated honeycomb lattices", [Phys. Rev. B 100, 075154 (2019)](https://doi.org/10.1103/PhysRevB.100.075154)'      - bullet: "M. F. López & J. Merino, \"From quantum anomalous Hall phases to topological metals in interacting decorated honeycomb lattices\", [Phys. Rev. B 100, 075154 (2019)](https://doi.org/10.1103/PhysRevB.100.075154)'
