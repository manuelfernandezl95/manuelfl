cv:
  name: Manuel Fernández López
  headline: Postdoctoral Researcher, Lattice Field Theory Group
  location: Hsinchu, Taiwan
  email: manuel.fernandezl@nycu.edu.tw
  phone:
  sections:
    Summary:
      - Condensed matter theorist specializing in topologically ordered, strongly correlated systems and their applications to quantum information science.
    Research Focus:
      - bullet: Strongly correlated quantum materials
      - bullet: Interaction-driven topological transitions
      - bullet: Green function zeros
